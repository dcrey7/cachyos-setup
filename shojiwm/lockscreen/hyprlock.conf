# Lock screen for ShojiWM (Super+L, or auto after 10 minutes).
# Your Messi wallpaper, blurred, with a big clock and a password box.

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/lionel-messi-barcelona-priceless_pxl1zxyenorn1eq99f1emz5iw.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Noto Sans Bold
    color = rgba(255, 255, 255, 0.95)
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date "+%A %-d %B"
    font_size = 22
    font_family = Noto Sans
    color = rgba(255, 255, 255, 0.8)
    position = 0, 110
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(254, 188, 46, 0.9)
    fail_color = rgba(255, 95, 87, 0.9)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
